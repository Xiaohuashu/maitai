<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galerie &amp; Impressionen — MaiTai Bad Homburg</title>
  <meta name="description" content="Authentische Impressionen aus der Küche und den Gasträumen von MaiTai in Bad Homburg vor der Höhe.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

<body data-page="gallery">
  <header class="site-header" data-header></header>

  <main>
    <section class="hero hero--page">
      <div class="layer layer--img">
        <img src="assets/img/interior-main.jpg" alt="Gastraum Restaurant MaiTai">
      </div>
      <div class="layer layer--shade"></div>
            <div class="container hero__content">
        <span class="eyebrow reveal">Galerie</span>
        <h1 class="display reveal reveal-d1">Impressionen &amp; <span class="italic">Atmosphäre</span></h1>
        <p class="lead reveal reveal-d2">Echte Aufnahmen aus unserem Restaurant in der Altstadt und von unseren frisch zubereiteten Gerichten.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="masonry">
          <figure class="reveal">
            <img src="assets/img/ente-knusprig.jpg" alt="74 Ped Krob Tamarind" loading="lazy">
            <figcaption>74 · Ped Krob Tamarind · Knusprige Ente (24.50 €)</figcaption>
          </figure>
          <figure class="reveal">
            <img src="assets/img/garnele.jpg" alt="90 Goong Phad Krapao" loading="lazy">
            <figcaption>90 · Goong Phad Krapao · Riesengarnelen mit Basilikum (25.90 €)</figcaption>
          </figure>
          <figure class="reveal">
            <img src="assets/img/obergasse.jpg" alt="Historische Fachwerkfassade Obergasse 14" loading="lazy">
            <figcaption>Obergasse 14 · Historisches Fachwerk in der Bad Homburger Altstadt</figcaption>
          </figure>
          <figure class="reveal">
            <img src="assets/img/curry-rot.jpg" alt="30 Gaeng Daeng Gai" loading="lazy">
            <figcaption>30 · Gaeng Daeng Gai · Rotes Kokoscurry (18.50 €)</figcaption>
          </figure>
          <figure class="reveal">
            <img src="assets/img/interior-main.jpg" alt="Hauptgastraum Restaurant MaiTai" loading="lazy">
            <figcaption>Gemütlicher Gastraum mit warmem Holz &amp; asiatischen Akzenten</figcaption>
          </figure>
          <figure class="reveal">
            <img src="assets/img/sommerrolle.jpg" alt="12 Goi Cuon Sai Gon" loading="lazy">
            <figcaption>12 · Goi Cuon Sai Gon · Frische Sommerrollen (8.90 €)</figcaption>
          </figure>
          <figure class="reveal">

          </figure>
          <figure class="reveal">
            <img src="assets/img/suppe-tomkha.jpg" alt="15 Tom Kha Gai Suppe" loading="lazy">
            <figcaption>15 · Tom Kha Gai · Kokossuppe mit Galgant (8.90 €)</figcaption>
          </figure>
          <figure class="reveal">
            <img src="assets/img/curry-gruen.jpg" alt="35 Gaeng Kiew Wan Grünes Curry" loading="lazy">
            <figcaption>35 · Gaeng Kiew Wan · Grünes Kräuter-Curry mit Garnelen (24.90 €)</figcaption>
          </figure>
          <figure class="reveal">
            <img src="assets/img/interior-1.jpg" alt="Gastraum Detailaufnahme" loading="lazy">
            <figcaption>Stilvoll eingedeckte Tische für festliche Abende</figcaption>
          </figure>
          <figure class="reveal">
            <img src="assets/img/interior-2.jpg" alt="Gastraum Ambiente" loading="lazy">
            <figcaption>Harmonische Beleuchtung und ruhige Atmosphäre</figcaption>
          </figure>
          <figure class="reveal">
            <img src="assets/img/interior-3.jpg" alt="Atmosphäre Restaurant" loading="lazy">
            <figcaption>Traditionelles Flair im Herzen der Taunus-Kurstadt</figcaption>
          </figure>

        <p class="note" style="text-align:center;margin-top:3rem">
          Originalaufnahmen aus dem Restaurant MaiTai (Obergasse 14, 61348 Bad Homburg vor der Höhe).
